name: Release

# Every push to main ships to GitHub Releases and npm:
# - package.json version not released yet → GitHub release `v<version>` + npm `latest`
# - already released → GitHub `nightly` prerelease + npm `<version>-nightly.<run>` under the `next` tag
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write # npm provenance

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:unit
      - name: Pick version
        id: v
        run: |
          version=$(node -p "require('./package.json').version")
          if gh release view "v$version" >/dev/null 2>&1 && npm view "omp-ui@$version" version >/dev/null 2>&1; then
            version="$version-nightly.$GITHUB_RUN_NUMBER"
            npm version "$version" --no-git-tag-version
            echo "kind=nightly" >> "$GITHUB_OUTPUT"
          else
            echo "kind=release" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      # npm pack runs prepack (vite build), so the tarball ships dist/.
      - name: Pack
        run: |
          npm pack
          cp "omp-ui-${{ steps.v.outputs.version }}.tgz" omp-ui.tgz
      - name: GitHub release v${{ steps.v.outputs.version }}
        if: steps.v.outputs.kind == 'release'
        run: gh release view "v${{ steps.v.outputs.version }}" >/dev/null 2>&1 || gh release create "v${{ steps.v.outputs.version }}" omp-ui.tgz "omp-ui-${{ steps.v.outputs.version }}.tgz" --target "$GITHUB_SHA" --title "OMP-UI v${{ steps.v.outputs.version }}" --generate-notes --latest
      - name: GitHub nightly prerelease
        if: steps.v.outputs.kind == 'nightly'
        run: |
          gh release delete nightly --cleanup-tag --yes || true
          gh release create nightly omp-ui.tgz --target "$GITHUB_SHA" --prerelease --title "OMP-UI nightly (${{ steps.v.outputs.version }})" \
            --notes "Latest build of main ($GITHUB_SHA). Install: \`npm i -g omp-ui@next\`"
      - name: Publish to npm
        run: |
          # Trusted Publishing (OIDC) needs npm >= 11.5.1; NPM_TOKEN is only a fallback.
          npm install -g npm@latest
          if npm view "omp-ui@${{ steps.v.outputs.version }}" version >/dev/null 2>&1; then echo "Already on npm"; exit 0; fi
          tag=latest; [ "${{ steps.v.outputs.kind }}" = nightly ] && tag=next
          # npm only accepts provenance from public repositories.
          prov=--provenance; [ "${{ github.event.repository.private }}" = true ] && prov=
          # A version waiting for approval (npm staged publishing) is invisible to `npm view`; that's done, not an error.
          set -o pipefail
          npm publish "omp-ui-${{ steps.v.outputs.version }}.tgz" $prov --access public --tag "$tag" 2>&1 | tee publish.log || {
            grep -q "previously staged version" publish.log && echo "Already staged; approve it on npmjs.com." && exit 0
            exit 1
          }
