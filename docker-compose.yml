# AgentMan with Docker Compose.
#   docker compose up -d                          # SQLite in ./data
#   omp-ui docker up --postgres | --mongo         # bundled database (saved to .env)
#   docker compose --profile public up -d         # + free cloudflared quick tunnel
#
# Compose reads ./.env (created by `omp-ui init`) for both variable interpolation
# and the container environment. Container paths below always win over the
# host-oriented values in .env (PORT/HOST/DATA_DIR/WORKSPACE_DIR/OMP_PATH).
name: omp-ui

services:
  omp-ui:
    build:
      context: .
    image: omp-ui:latest
    # Restarts it after a crash, and at boot when the Docker daemon is enabled
    # (`sudo systemctl enable docker`). Health-based restarts happen inside (bin/supervisor.mjs).
    restart: unless-stopped
    # Above OMP_UI_STOP_TIMEOUT_MS (8 s) so the supervisor can stop the server and drain its
    # agents before Docker sends SIGKILL.
    stop_grace_period: 30s
    ports:
      - "${PORT:-3000}:3000"
    env_file:
      - path: .env
        required: false
    # List form: a bare `- NAME` passes the variable through from the shell running
    # `docker compose` (or ./.env) and leaves it unset when neither has it.
    environment:
      - PORT=3000
      - HOST=0.0.0.0
      - DATA_DIR=/data
      - WORKSPACE_DIR=/workspace
      - OMP_PATH=omp
      # SQLite by default; `omp-ui docker up --mongo|--postgres` sets COMPOSE_DATABASE_URL.
      - DATABASE_URL=${COMPOSE_DATABASE_URL:-sqlite:/data/omp-ui.db}
      # SSH agent forwarding (see the ssh-agent.sock mount); unset by the entrypoint when
      # the host has no agent.
      - SSH_AUTH_SOCK=/run/ssh-agent.sock
      # Credentials inherited from the host environment (values are never written here).
      # Git hosting: "Create PR/MR" and HTTPS pushes (or the gh/glab logins mounted below).
      - GH_TOKEN
      - GITHUB_TOKEN
      - GITLAB_TOKEN
      - GITLAB_HOST
      # AI providers used by omp agents (or the omp/Claude sign-ins mounted below).
      - ANTHROPIC_API_KEY
      - ANTHROPIC_BASE_URL
      - CLAUDE_CODE_OAUTH_TOKEN
      - OPENAI_API_KEY
      - OPENAI_BASE_URL
      - GEMINI_API_KEY
      - GOOGLE_API_KEY
      # A path: it must exist inside the container too (e.g. under a mounted folder).
      - GOOGLE_APPLICATION_CREDENTIALS
      - OPENROUTER_API_KEY
      - GROQ_API_KEY
      - XAI_API_KEY
      - MISTRAL_API_KEY
      - DEEPSEEK_API_KEY
      - CEREBRAS_API_KEY
      - AWS_ACCESS_KEY_ID
      - AWS_SECRET_ACCESS_KEY
      - AWS_SESSION_TOKEN
      - AWS_REGION
      - AWS_PROFILE
      - AZURE_OPENAI_API_KEY
      # Proxies
      - HTTP_PROXY
      - HTTPS_PROXY
      - NO_PROXY
    volumes:
      - ./data:/data
      # Your projects: the folder picker starts here and cloned repositories land here
      - ${WORKSPACE_DIR:-./workspace}:/workspace
      # ── Credentials from the host user (sign in once on the host, not in the container) ──
      # Every host path below must exist before `docker compose up`, otherwise Docker
      # creates it as a root-owned directory (a ~/.claude.json directory breaks Claude).
      # `omp-ui docker up` creates the missing ones; with plain `docker compose`, run once:
      #   mkdir -p ~/.omp ~/.claude ~/.config/git ~/.config/gh ~/.config/glab-cli ~/.aws
      #   mkdir -p -m 700 ~/.ssh; touch ~/.gitconfig
      #   [ -e ~/.claude.json ] || echo '{}' > ~/.claude.json
      #   [ -e ~/.git-credentials ] || install -m 600 /dev/null ~/.git-credentials
      # Delete the lines you do not want to share.
      # omp provider sign-ins & config (read-write: OAuth tokens get refreshed)
      - ${OMP_HOME:-~/.omp}:/home/omp/.omp
      # Claude Code / Anthropic sign-in (read-write: OAuth tokens get refreshed)
      - ~/.claude:/home/omp/.claude
      - ~/.claude.json:/home/omp/.claude.json
      # Git identity, credential helpers and saved HTTPS credentials
      - ~/.gitconfig:/home/omp/.gitconfig:ro
      - ~/.config/git:/home/omp/.config/git:ro
      - ~/.git-credentials:/home/omp/.git-credentials:ro
      # SSH keys, plus the host's ssh-agent when SSH_AUTH_SOCK is set (start with
      # `SSH_AUTH_SOCK= docker compose up -d` to skip it). Docker Desktop on macOS:
      # `SSH_AUTH_SOCK=/run/host-services/ssh-auth.sock docker compose up -d`.
      - ~/.ssh:/home/omp/.ssh:ro
      - ${SSH_AUTH_SOCK:-/dev/null}:/run/ssh-agent.sock
      # GitHub CLI and GitLab CLI sign-ins
      - ~/.config/gh:/home/omp/.config/gh
      - ~/.config/glab-cli:/home/omp/.config/glab-cli
      # AWS profiles (Bedrock)
      - ~/.aws:/home/omp/.aws:ro
    depends_on:
      mongo:
        condition: service_started
        required: false
      postgres:
        condition: service_healthy
        required: false

  mongo:
    # CPUs without AVX (MongoDB 5+ needs it): set MONGO_IMAGE=mongo:4.4
    image: ${MONGO_IMAGE:-mongo:7}
    profiles: [mongo]
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db

  postgres:
    image: postgres:17-alpine
    profiles: [postgres]
    restart: unless-stopped
    environment:
      POSTGRES_USER: omp_ui
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-omp_ui}
      POSTGRES_DB: omp_ui
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U omp_ui -d omp_ui"]
      interval: 5s
      timeout: 5s
      retries: 10

  tunnel:
    image: cloudflare/cloudflared:latest
    profiles: [public]
    restart: unless-stopped
    command: tunnel --no-autoupdate --url http://omp-ui:3000
    depends_on:
      - omp-ui

volumes:
  mongo-data:
  pg-data:
